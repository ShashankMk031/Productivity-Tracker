<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sticky Notes Board - Productivity Tracker</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/css/strategic.css" />
  <style>
    /* Whitespace Thinking Wall Canvas Styles */
    .board-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 180px);
      gap: var(--space-md);
      position: relative;
    }

    .board-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-md);
      background: rgba(11, 19, 24, 0.5);
      border: 1px solid var(--border);
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius);
      backdrop-filter: blur(10px);
    }

    .board-toolbar-actions {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .board-canvas-viewport {
      flex: 1;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #060b0e;
      background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 20px 20px;
      position: relative;
      cursor: grab;
      user-select: none;
    }

    .board-canvas-viewport:active {
      cursor: grabbing;
    }

    .board-canvas {
      width: 3500px;
      height: 3500px;
      position: relative;
    }

    /* Premium Sticky Note Opaque Styles */
    .sticky-note {
      position: absolute;
      width: 240px;
      height: 135px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      padding: 0;
      cursor: default;
      user-select: auto;
      transition: box-shadow 0.2s ease, transform 0.15s ease;
      resize: both; /* Enable user manual sizing power */
      overflow: hidden; /* Needed for CSS resize handle */
    }

    .fridge-magnet {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle at 5px 5px, #ef4444 30%, #b91c1c 80%);
      box-shadow: 0 3px 5px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.45);
      border: 1px solid rgba(0,0,0,0.2);
      z-index: 10;
      pointer-events: none;
    }

    .sticky-note:active {
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
      transform: scale(1.01);
    }

    /* Color classes matching solid opaque pastels with readable high contrast text */
    .sticky-yellow {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #1e293b;
    }
    .sticky-yellow .sticky-textarea { color: #1e293b; }
    .sticky-yellow .sticky-tag-input { color: #1e293b; }
    .sticky-yellow .sticky-tag-input::placeholder { color: #78350f; opacity: 0.6; }

    .sticky-pink {
      background: #fce7f3;
      border: 1px solid #f43f5e;
      color: #831843;
    }
    .sticky-pink .sticky-textarea { color: #831843; }
    .sticky-pink .sticky-tag-input { color: #831843; }
    .sticky-pink .sticky-tag-input::placeholder { color: #9d174d; opacity: 0.6; }

    .sticky-blue {
      background: #e0f2fe;
      border: 1px solid #0ea5e9;
      color: #0369a1;
    }
    .sticky-blue .sticky-textarea { color: #0369a1; }
    .sticky-blue .sticky-tag-input { color: #0369a1; }
    .sticky-blue .sticky-tag-input::placeholder { color: #075985; opacity: 0.6; }

    .sticky-green {
      background: #d1fae5;
      border: 1px solid #10b981;
      color: #065f46;
    }
    .sticky-green .sticky-textarea { color: #065f46; }
    .sticky-green .sticky-tag-input { color: #065f46; }
    .sticky-green .sticky-tag-input::placeholder { color: #065f46; opacity: 0.6; }

    .sticky-purple {
      background: #f3e8ff;
      border: 1px solid #a855f7;
      color: #5b21b6;
    }
    .sticky-purple .sticky-textarea { color: #5b21b6; }
    .sticky-purple .sticky-tag-input { color: #5b21b6; }
    .sticky-purple .sticky-tag-input::placeholder { color: #6b21a8; opacity: 0.6; }

    /* Sticky Header elements */
    .sticky-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(0, 0, 0, 0.15);
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      cursor: grab;
      user-select: none;
    }
    .sticky-header:active {
      cursor: grabbing;
    }

    .sticky-header-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sticky-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sticky-complete-checkbox {
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    /* Completed state styling */
    .sticky-completed {
      opacity: 0.65;
      text-decoration: line-through;
      filter: grayscale(30%);
    }

    .sticky-draft-badge {
      font-size: 9px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      padding: 1px 4px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Color picker dots inside note */
    .sticky-color-selector {
      display: flex;
      gap: 4px;
    }

    .color-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .color-dot:hover {
      transform: scale(1.25);
    }

    /* Textarea direct editing */
    .sticky-body {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
    }

    .sticky-textarea {
      flex: 1;
      background: transparent;
      border: none;
      resize: none;
      font-size: 13px;
      line-height: 1.5;
      outline: none;
      padding: 0;
      font-family: inherit;
      cursor: text;
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    /* Footer / tags input */
    .sticky-footer {
      padding: 6px 12px 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sticky-tag-container {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    .sticky-tag-icon {
      font-size: 10px;
      opacity: 0.5;
    }

    .sticky-tag-input {
      background: transparent;
      border: none;
      font-size: 11px;
      outline: none;
      flex: 1;
      min-width: 0;
      padding: 0;
      font-family: inherit;
      font-weight: 500;
      opacity: 0.8;
      cursor: text;
      user-select: text !important;
      -webkit-user-select: text !important;
    }



    .sticky-tag-input::placeholder {
      color: var(--muted-2);
      font-weight: 400;
    }

    /* Buttons */
    .sticky-action-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 2px;
      font-size: 11px;
      color: var(--muted);
      transition: color 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sticky-action-btn:hover {
      color: var(--text);
    }

    .sticky-pin-btn {
      color: var(--green);
    }
    .sticky-pin-btn:hover {
      color: #7ef576;
    }

    .sticky-delete-btn:hover {
      color: var(--danger);
    }

    /* Save Indicator badge */
    .save-indicator {
      font-size: 9px;
      color: var(--muted-2);
      font-family: monospace;
      user-select: none;
      margin-left: 6px;
    }
  </style>
</head>
<body>

<!-- Loading overlay -->
<div id="loading-overlay">
  <div class="spinner"></div>
</div>

<div class="app-layout-shell">
  <!-- Sidebar Navigation Container -->
  <nav id="sidebar-nav-container"></nav>

  <!-- Main Content Area -->
  <main class="main-content-area">
    
    <div class="board-container">
      <!-- Top Toolbar -->
      <div class="board-toolbar">
        <div style="display: flex; align-items: center; gap: 8px; flex: 1; max-width: 400px;">
          <input type="text" id="board-search-input" class="ui-form-input" placeholder="Search notes or #tag..." />
        </div>
        <div class="board-toolbar-actions">
          <button class="ui-btn ui-btn-secondary" id="btn-archive-completed">📥 Archive Completed</button>
          <button class="ui-btn ui-btn-danger" id="btn-delete-completed">🗑️ Delete Completed</button>
        </div>
      </div>

      <!-- Thinking Wall Canvas Viewport -->
      <div class="board-canvas-viewport" id="board-canvas-viewport">
        <div class="board-canvas" id="board-canvas">
          <!-- Stickies generated dynamically here -->
        </div>
      </div>
    </div>

    <footer class="app-footer" style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted-2); text-align: center;">
      local-first · no cloud · no auth · board canvas
    </footer>
  </main>
</div>

<script type="module" src="/static/js/navigation.js"></script>
<script type="module" src="/static/js/board.js"></script>
</body>
</html>
