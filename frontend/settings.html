<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings - Productivity Tracker</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    .settings-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 24px;
    }
    .settings-section {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .settings-section h2 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 18px;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 14px;
    }
    .stat-row:last-child {
      border-bottom: none;
    }
    .backup-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.2);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .backup-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .backup-actions {
      display: flex;
      gap: 8px;
    }
  </style>
</head>
<body>

<header class="app-header">
  <div class="header-top">
    <div class="header-month">
      <h1 class="month-title">⚙️ System Settings & Health</h1>
    </div>
    <div class="header-stats-grid">
      <a href="/" class="btn-secondary" style="text-decoration: none;">🏠 Back to Dashboard</a>
    </div>
  </div>
</header>

<div class="settings-container">
  
  <div class="settings-section">
    <h2>Data Backups & Export</h2>
    <div style="display: flex; gap: 12px; margin-bottom: 16px;">
      <button class="btn-primary" id="btn-create-backup">💾 Create Backup Now</button>
      <a href="/api/settings/export" class="btn-secondary" style="text-decoration: none; display: inline-flex; align-items: center;">📦 Download Export Archive</a>
    </div>
    
    <h3>Available Backups</h3>
    <div id="backups-list">
      <div style="color: var(--muted); font-size: 13px;">Loading backups...</div>
    </div>
  </div>

  <div class="settings-section">
    <h2>System Health (Database)</h2>
    <div id="health-stats">
      <div style="color: var(--muted); font-size: 13px;">Loading health stats...</div>
    </div>
  </div>
  
  <div class="settings-section">
    <h2>Storage Usage</h2>
    <div id="storage-stats">
      <div style="color: var(--muted); font-size: 13px;">Loading storage stats...</div>
    </div>
  </div>

</div>

<script type="module" src="/static/js/settings.js"></script>
</body>
</html>
